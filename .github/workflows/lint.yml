name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"
      - uses: leafo/gh-actions-luarocks@v6
      - name: Install luacheck
        run: luarocks install luacheck 1.2.0-1
      - name: luacheck
        run: luacheck .
      - name: luac compile check
        run: find Engine Runtime Core Game UI Data -name '*.lua' -print0 | xargs -0 -n1 luac -p
      - name: stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ github.token }}
          version: 2.5.2
          args: --check Engine Runtime Core Game UI Data
      - name: Install selene
        run: |
          curl -sSL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip -q selene.zip -d "$RUNNER_TEMP/selene"
          chmod +x "$RUNNER_TEMP/selene/selene"
          echo "$RUNNER_TEMP/selene" >> "$GITHUB_PATH"
      - name: selene
        run: selene Engine Runtime Core Game UI Data
